<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Agendar Consulta</title>
</head>
<body>
<h1>Agendamento de Consulta</h1>

<form th:action="${consulta.id == null} ? @{/consulta/save} : @{/consulta/update}"
      th:object="${consulta}" method="post">

  <input type="hidden" th:field="*{id}" />

  <label>Data e Hora:</label>
  <input type="datetime-local" th:field="*{data}" required /><br><br>

  <label>Valor (R$):</label>
  <input type="number" step="0.01" th:field="*{valor}" required /><br><br>

  <label>Observação:</label>
  <input type="text" th:field="*{observacao}" /><br><br>


  <label>Paciente:</label>
  <select th:field="*{paciente.id}" required>
    <option value="">Selecione um Paciente...</option>
    <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option>
  </select><br><br>


  <label>Médico:</label>
  <select th:field="*{medico.id}" required>
    <option value="">Selecione um Médico...</option>
    <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}"></option>
  </select><br><br>

  <button type="submit">Salvar</button>
  <a th:href="@{/consulta/list}">Cancelar</a>
</form>
</body>
</html>
