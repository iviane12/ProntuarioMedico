<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Consultas</title>
</head>
<body>
<h1>Consultas Agendadas</h1>
<a th:href="@{/consulta/form}">+ Nova Consulta</a> <br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Paciente</th>
        <th>Médico</th>
        <th>Valor (R$)</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${consultas}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.data}"></td>
        <td th:text="${c.paciente.nome}"></td>
        <td th:text="${c.medico.nome}"></td>
        <td th:text="${c.valor}"></td>
        <td>
            <a th:href="@{/consulta/edit/{id}(id=${c.id})}">Editar</a> |
            <a onclick="return window.confirm('Cancelar esta consulta?')"
               th:href="@{/consulta/remove/{id}(id=${c.id})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
