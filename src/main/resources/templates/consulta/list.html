<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(title='Lista de Consultas')}"></head>

<body>
<main>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">Consultas Agendadas</h2>
            <a th:href="@{/consulta/form}" class="btn btn-success">+ Nova Consulta</a>
        </div>

        <table class="table table-striped table-hover table-bordered shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Data e Hora</th>
                <th>Paciente</th>
                <th>Médico</th>
                <th>Valor (R$)</th>
                <th class="text-center">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${consultas}">
                <td th:text="${c.id}"></td>
                <!-- Opcional: Você pode formatar a data aqui depois -->
                <td th:text="${c.data}"></td>
                <td th:text="${c.paciente.nome}"></td>
                <td th:text="${c.medico.nome}"></td>
                <td th:text="${c.valor}"></td>
                <td class="text-center">
                    <a th:href="@{/consulta/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a onclick="return window.confirm('Cancelar esta consulta?')"
                       th:href="@{/consulta/remove/{id}(id=${c.id})}" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
