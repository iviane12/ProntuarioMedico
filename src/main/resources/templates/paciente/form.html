<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(title='Formulário de Paciente')}"></head>

<body>
<main>
  <div class="container mt-4">
    <h2 class="text-primary mb-4">Cadastro de Paciente</h2>

    <form class="card p-4 shadow-sm" th:action="${paciente.id == null} ? @{/paciente/save} : @{/paciente/update}"
          th:object="${paciente}" method="post">

      <input type="hidden" th:field="*{id}" />

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Nome:</label>
          <input type="text" class="form-control" th:field="*{nome}" required />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">CPF:</label>
          <input type="text" class="form-control" th:field="*{cpf}" required />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">E-mail:</label>
          <input type="email" class="form-control" th:field="*{email}" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Telefone:</label>
          <input type="text" class="form-control" th:field="*{telefone}" required />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Salvar Paciente</button>
        <a th:href="@{/paciente/list}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
